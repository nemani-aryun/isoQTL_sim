# isoQTL_sim configuration template.
#
# 1. Copy this file:            cp config/example.yaml my_run.yaml
# 2. Replace every /path/to/... with a real path (five of them).
# 3. Check it:                  isoqtl-sim prepare --config my_run.yaml
#
# Every setting is explained in docs/CONFIG.md. Settings marked "optional" can be
# deleted. Lines starting with # are comments.

output_dir: /path/to/results/my_run   # one directory per run; created if missing
seed: 1                               # same seed + same settings = same results
genes_per_job: 15                     # genes per simulate/train job (see docs/CONFIG.md)
threads: 4                            # cores for Salmon and STAR jobs
run_reads: false                      # true: also simulate RNA-seq reads and quantify them
truth_annotation: gencode_v38         # the entry under `reference` that defines the true isoforms

reference:
  gencode_v38:
    gtf: /path/to/gencode.v38.annotation.gtf
    fasta: /path/to/gencode.v38.transcripts.fa
    # salmon_index: /path/to/salmon_index   # optional: use an existing Salmon index

genotypes:
  vcf_template: /path/to/genotypes_chr{chr}.vcf.gz   # {chr} is replaced by 1..22
  chr_prefix: ""                      # "chr" if the VCF names chromosomes chr1, chr2, ...
  # sample_file: /path/to/samples.txt # optional: use only these sample IDs (one per line)
  # n_samples: 500                    # optional: a random subset of the samples

windows:
  causal: 250000            # causal SNPs lie within this distance (bp) of the gene
  train: 1000000            # prediction models and GWAS use SNPs within this distance

simulation:
  n_genes: 100              # a number, or "all" for every protein-coding autosomal gene
  n_causal: 4               # causal SNPs per isoform
  prop_shared: [0.5, 0.75, 1]   # share of causal SNPs common to all isoforms (drawn per gene)
  h2_g: {beta: [2, 20]}     # cis-heritability per isoform, drawn from Beta(2, 20); or a number
  cov_B: [0.7, 0.9]         # correlation range of shared effects across isoforms
  cov_E: [0, 0.5]           # correlation range of residual noise across isoforms

trait:
  scenarios:                # one GWAS per scenario per gene; "null" must stay quoted
    - {name: "null",        h2ge: 0,      n_gwas: 100000, mediator: gene}
    - {name: gene_5e-4,     h2ge: 0.0005, n_gwas: 100000, mediator: gene}
    - {name: isoform_5e-4,  h2ge: 0.0005, n_gwas: 100000, mediator: isoform}

# Used only when run_reads is true.
reads: {read_length: 75, library_size: 30000000, paired_end: true}
quant:
  salmon: [gencode_v38]     # annotations to quantify with Salmon
  min_prop_expressed: 0.75  # keep features with TPM > 0.1 in this share of samples
  fastqc: false
  # star:                   # optional, and not yet tested anywhere
  #   index: /path/to/star_index
  #   annotations: [gencode_v38]

models:
  methods: [enet, blup, susie]        # univariate models; the best by CV R2 is kept
  # isotwas:                          # optional: multivariate isoform models (slower)
  #   methods: [multi_enet, mrce_lasso, joinet, spls, sgl, mtlasso, stacking, univariate]
  #   omega_est: mean

summary: {alpha: 0.05}

# Optional per-stage limits for LSF, by stage name or its first word.
# resources:
#   train: {hours: 24, mem_gb: 32}

# Used only by `isoqtl-sim submit` (LSF clusters). Ignored by `isoqtl-sim run`.
lsf:
  job_prefix: isoqtl        # job names start with this
  queue_short: short        # queue for stages of up to short_hours
  queue_long: medium        # queue for longer stages
  short_hours: 3
  max_running: 200          # at most this many array jobs run at once
  max_array_size: 1000      # LSF's limit on jobs per array (MAX_JOB_ARRAY_SIZE in `bparams -a`)
  mem_per_gb: 1             # 1024 on clusters where LSF counts memory in MB
  # Command that runs each job inside the software environment, for example
  # "conda run --no-capture-output -p /path/to/env" or "apptainer exec /path/to/isoqtl-sim.sif".
  container_exec: ""
