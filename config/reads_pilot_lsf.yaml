# Read-level pilot: 100 genes with simulated reads, quantified by Salmon, then the
# same TWAS comparison on true and Salmon-estimated expression.
# Replace every CHANGE_ME. Paths are the lab's; confirm them on the cluster.

output_dir: /rsrch5/scratch/epi/CHANGE_ME/isoqtl_pilot/results_reads_pilot
seed: 1
genes_per_job: 15
threads: 4
run_reads: true
truth_annotation: gencode_v38

reference:
  gencode_v38:
    gtf: /rsrch5/home/epi/bhattacharya_lab/data/GenomicReferences/txome/gencode_v38/gencode.v38.annotation.gtf
    fasta: /rsrch5/home/epi/bhattacharya_lab/data/GenomicReferences/txome/gencode_v38/gencode.v38.transcripts.fa
    # salmon_index: /path/to/index   # optional; without it the pipeline builds one

genotypes:
  vcf_template: /rsrch9/home/epi/bhattacharya_lab/users/sthead/GTEx_gencode_comp/pass1/files_for_analysis/1KG_vcf/genos_1kg_eur_500_snps_maf_0.01_chr{chr}.vcf.gz
  chr_prefix: ""          # use the value that worked in the pilot
  # n_samples: 100        # optional: a random subset of the VCF's samples

windows:
  causal: 250000
  train: 1000000

simulation:
  n_genes: 100
  n_causal: 4
  prop_shared: [0.5, 0.75, 1]
  h2_g: {beta: [2, 20]}
  cov_B: [0.7, 0.9]
  cov_E: [0, 0.5]

trait:
  scenarios:
    - {name: "null",        h2ge: 0,       n_gwas: 100000, mediator: gene}
    - {name: gene_1e-4,     h2ge: 0.0001,  n_gwas: 100000, mediator: gene}
    - {name: gene_2.5e-4,   h2ge: 0.00025, n_gwas: 100000, mediator: gene}
    - {name: gene_5e-4,     h2ge: 0.0005,  n_gwas: 100000, mediator: gene}
    - {name: gene_1e-3,     h2ge: 0.001,   n_gwas: 100000, mediator: gene}
    - {name: isoform_1e-4,   h2ge: 0.0001,  n_gwas: 100000, mediator: isoform}
    - {name: isoform_2.5e-4, h2ge: 0.00025, n_gwas: 100000, mediator: isoform}
    - {name: isoform_5e-4,   h2ge: 0.0005,  n_gwas: 100000, mediator: isoform}
    - {name: isoform_1e-3,   h2ge: 0.001,   n_gwas: 100000, mediator: isoform}

# Only the simulated genes are expressed, so every read comes from them. 150,000 read
# pairs over 100 genes matches the depth per gene of 30 million over all genes.
reads: {read_length: 75, library_size: 150000, paired_end: true}

quant:
  salmon: [gencode_v38]
  min_prop_expressed: 0.75
  fastqc: false
  # STAR and featureCounts have not been run anywhere yet. To try them, uncomment:
  # star:
  #   index: /rsrch5/home/epi/bhattacharya_lab/data/GenomicReferences/star-2.7.4a_GCA_000001405.15_GRCh38_no_alt_analysis_set
  #   annotations: [gencode_v38]

models: {methods: [enet, blup, susie]}
summary: {alpha: 0.05}

# Optional per-stage limits, by stage name or its first word. Defaults are in `plan`.
# resources:
#   salmon: {hours: 8, mem_gb: 24}

lsf:
  job_prefix: isoqtl_reads
  queue_short: short
  queue_long: medium
  short_hours: 3
  max_running: 200
  max_array_size: 1000    # LSF's default limit on array size
  mem_per_gb: 1           # use 1024 on clusters where LSF counts memory in MB
  container_exec: /risapps/rhel8/miniforge3/24.5.0-0/bin/conda run --no-capture-output -p /rsrch5/scratch/epi/CHANGE_ME/isoqtl_pilot/env
