# Cluster pilot: 100 genes, no read simulation. Replace every CHANGE_ME.
# Paths marked "from the original scripts" need confirming on the cluster.

output_dir: /rsrch5/scratch/epi/CHANGE_ME/isoqtl_pilot/results
seed: 1
genes_per_job: 15
threads: 4
run_reads: false          # true adds read simulation and Salmon/STAR (much more expensive)
truth_annotation: gencode_v38

reference:
  gencode_v38:            # from the original scripts
    gtf: /rsrch5/home/epi/bhattacharya_lab/data/GenomicReferences/txome/gencode_v38/gencode.v38.annotation.gtf
    fasta: /rsrch5/home/epi/bhattacharya_lab/data/GenomicReferences/txome/gencode_v38/gencode.v38.transcripts.fa

genotypes:                # from the original scripts; these VCFs were filtered at MAF 0.05
  vcf_template: /rsrch9/home/epi/bhattacharya_lab/users/sthead/GTEx_gencode_comp/pass1/files_for_analysis/1KG_vcf/genos_1kg_eur_500_snps_maf_0.01_chr{chr}.vcf.gz
  chr_prefix: ""          # use "chr" if the VCF names chromosomes chr1, chr2, ...

windows:
  causal: 250000          # causal SNPs are drawn within this distance of the gene
  train: 1000000          # models and GWAS use SNPs within this distance

simulation:
  n_genes: 100            # or "all"
  n_causal: 4
  prop_shared: [0.5, 0.75, 1]
  h2_g: {beta: [2, 20]}   # a number instead fixes h2 for every gene
  cov_B: [0.7, 0.9]
  cov_E: [0, 0.5]

trait:
  scenarios:
    - {name: null_100k, h2ge: 0, n_gwas: 100000, mediator: gene}
    - {name: gene_100k, h2ge: 0.001, n_gwas: 100000, mediator: gene}
    - {name: isoform_100k, h2ge: 0.001, n_gwas: 100000, mediator: isoform}

reads: {read_length: 75, library_size: 30000000, paired_end: true}
quant: {salmon: [gencode_v38], min_prop_expressed: 0.75, fastqc: false}
models: {methods: [enet, blup, susie]}
summary: {alpha: 0.05}

lsf:
  job_prefix: isoqtl_pilot
  queue_short: short      # for jobs of up to short_hours; confirm names with bqueues
  queue_long: medium
  short_hours: 3
  max_running: 200
  # Runs each job inside the environment, so compute nodes need no activation step.
  container_exec: /risapps/rhel8/miniforge3/24.5.0-0/bin/conda run --no-capture-output -p /rsrch5/scratch/epi/CHANGE_ME/isoqtl_pilot/env
